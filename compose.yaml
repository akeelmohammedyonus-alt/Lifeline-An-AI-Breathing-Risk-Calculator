services:
  app:
    image: ${LIFELINE_IMAGE:?Set LIFELINE_IMAGE to the GHCR image}
    restart: unless-stopped
    env_file:
      - ./lifeline.env
    expose:
      - "3000"
    environment:
      VIRTUAL_HOST: ${DOMAIN:?Set DOMAIN to the public hostname}
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: ${DOMAIN:?Set DOMAIN to the public hostname}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL for certificate registration}
    networks:
      default: {}
      proxy_network:
        aliases:
          - lifeline-app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default: {}

  proxy_network:
    external: true
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK to the existing proxy Docker network}

