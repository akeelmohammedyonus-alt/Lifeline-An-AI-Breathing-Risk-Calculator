name: Build and publish Docker image to GHCR

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE_NAME: lifeline-ai
  IMAGE_TAG: ${{ github.sha }}
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Set GHCR image path
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PATH=${REGISTRY}/${OWNER}/${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${IMAGE_PATH}:${IMAGE_TAG} .
          docker tag ${IMAGE_PATH}:${IMAGE_TAG} ${IMAGE_PATH}:latest

      - name: Push Docker image to GHCR
        run: |
          docker push ${IMAGE_PATH}:${IMAGE_TAG}
          docker push ${IMAGE_PATH}:latest

      - name: Show image URL
        run: echo "Image published to ${IMAGE_PATH}:${IMAGE_TAG}"
