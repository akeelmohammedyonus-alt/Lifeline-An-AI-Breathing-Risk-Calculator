name: Build and publish Docker image to GHCR

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE_NAME: lifeline-ai
  IMAGE_TAG: ${{ github.sha }}
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-and-push:
    needs: test
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set GHCR image path
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PATH=${REGISTRY}/${OWNER}/${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push native image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.architecture }}
          push: true
          tags: |
            ${{ env.IMAGE_PATH }}:${{ env.IMAGE_TAG }}-${{ matrix.architecture }}
            ${{ env.IMAGE_PATH }}:latest-${{ matrix.architecture }}

  publish-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Set GHCR image path
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PATH=${REGISTRY}/${OWNER}/${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish multi-platform tags
        run: |
          docker buildx imagetools create \
            --tag ${IMAGE_PATH}:${IMAGE_TAG} \
            ${IMAGE_PATH}:${IMAGE_TAG}-amd64 \
            ${IMAGE_PATH}:${IMAGE_TAG}-arm64
          docker buildx imagetools create \
            --tag ${IMAGE_PATH}:latest \
            ${IMAGE_PATH}:latest-amd64 \
            ${IMAGE_PATH}:latest-arm64

      - name: Show image URL
        run: echo "Image published to ${IMAGE_PATH}:${IMAGE_TAG}"
